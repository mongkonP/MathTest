<!DOCTYPE html>
<html lang="th">
<head>
    <title>แบบทดสอบเรื่องทรงกลม</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>
    <style>
        body {
            background-color: #eeeadf;
        }
    </style>
</head>
<body>

<div class="container" style="margin-top: 20px;">
    <h2>แบบทดสอบเรื่องทรงกลม</h2>
    
    <button type="button" class="btn btn-primary" onclick="randomNum()">สุ่มโจทย์ใหม่</button>
    
    <hr>

    <div class="panel panel-default">
        <div class="panel-body">
            <img src="../img/sphere.jpeg" class="img-responsive thumbnail" style="max-width: 500px;" alt="ทรงกลม"><br>
            <p>1. ทรงกลม มีรัศมียาว <strong id="r1">?</strong> จะมีปริมาตรเท่ากับเท่าใด <br><small class="text-muted">(สูตร: (4/3) × π × r³ | กำหนดให้ π = 3.14)</small></p>
            <div class="form-inline">
                <div class="form-group">
                    <label>ตอบ: </label>
                    <input type="text" class="form-control" id="ans1">
                </div>
                <button type="button" class="btn btn-success" onclick="check1()">เช็คคำตอบ</button>
                <span id="result1" class="label" style="font-size: 14px;"></span>
            </div>
        </div>
    </div>

    <div class="panel panel-default">
        <div class="panel-body">
            <p>2. ทรงกลม มีรัศมียาว <strong id="r2">?</strong> จะมีพื้นที่ผิวทั้งหมดเท่ากับเท่าใด <br><small class="text-muted">(สูตร: 4 × π × r² | กำหนดให้ π = 3.14)</small></p>
            <div class="form-inline">
                <div class="form-group">
                    <label>ตอบ: </label>
                    <input type="text" class="form-control" id="ans2">
                </div>
                <button type="button" class="btn btn-success" onclick="check2()">เช็คคำตอบ</button>
                <span id="result2" class="label" style="font-size: 14px;"></span>
            </div>
        </div>
    </div>
</div>

<script>
    var radius1 = 0;
    var radius2 = 0;
    var pi = 3.14;

    function randomNum() {
        // สุ่มตัวเลขช่วง 50 ถึง 100
        radius1 = Math.floor(Math.random() * 51) + 50;
        radius2 = Math.floor(Math.random() * 51) + 50;

        document.getElementById("r1").innerText = radius1;
        document.getElementById("r2").innerText = radius2;

        document.getElementById("ans1").value = "";
        document.getElementById("ans2").value = "";
        
        var res1 = document.getElementById("result1");
        var res2 = document.getElementById("result2");
        res1.innerText = "";
        res1.className = "label";
        res2.innerText = "";
        res2.className = "label";
    }

    function check1() {
        var userAns = parseFloat(document.getElementById("ans1").value);
        var correctAns = (4/3) * pi * Math.pow(radius1, 3);
        correctAns = Math.round(correctAns * 100) / 100;
        var res = document.getElementById("result1");

        if (Math.abs(userAns - correctAns) < 0.1) {
            res.innerText = "ถูกต้อง";
            res.className = "label label-success";
        } else {
            res.innerText = "ผิด (เฉลย: " + correctAns + ")";
            res.className = "label label-danger";
        }
    }

    function check2() {
        var userAns = parseFloat(document.getElementById("ans2").value);
        var correctAns = 4 * pi * radius2 * radius2;
        correctAns = Math.round(correctAns * 100) / 100;

        var res = document.getElementById("result2");

        if (Math.abs(userAns - correctAns) < 0.1) {
            res.innerText = "ถูกต้อง";
            res.className = "label label-success";
        } else {
            res.innerText = "ผิด (เฉลย: " + correctAns + ")";
            res.className = "label label-danger";
        }
    }

    randomNum();
</script>

</body>
</html>
