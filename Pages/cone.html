<!DOCTYPE html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>แบบทดสอบเรื่องทรงกรวย</title><link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css"><link rel="stylesheet" href="../assets/css/app.css"><script src="../assets/js/quiz.js" defer></script><script src="../assets/js/navigation.js" defer></script></head><body><main class="container"><section class="app-card"><h1 class="app-title">ทรงกรวย</h1><p class="app-subtitle">กำหนดให้ π = 3.14</p><div class="app-actions"><button id="newQuestions" class="btn btn-primary" type="button">สุ่มโจทย์ใหม่</button><button class="btn btn-default" type="button" data-nav-home="../index.html">← กลับหน้าเมนูหลัก</button></div><img class="img-responsive thumbnail quiz-image" src="../img/cone.jpeg" alt="ทรงกรวย"><div id="quizQuestions"></div></section></main><script>window.addEventListener("DOMContentLoaded",()=>{const quiz=new GeometryQuiz({questions:[{prompt:v=>`ทรงกรวยมีรัศมีฐาน <strong>${v.r}</strong> และความสูง <strong>${v.h}</strong> จะมีปริมาตรเท่าใด`,hint:"สูตร: 1/3 × π × r² × h",generate:()=>({r:randomInt(3,15),h:randomInt(6,30)}),answer:v=>(1/3)*3.14*v.r*v.r*v.h},{prompt:v=>`ทรงกรวยมีรัศมีฐาน <strong>${v.r}</strong> และสูงเอียง <strong>${v.l}</strong> จะมีพื้นที่ผิวทั้งหมดเท่าใด`,hint:"สูตร: (π × r²) + (π × r × l)",generate:()=>({r:randomInt(3,15),l:randomInt(6,30)}),answer:v=>3.14*v.r*v.r+3.14*v.r*v.l}]});quiz.start();document.getElementById("newQuestions").addEventListener("click",()=>quiz.newQuestions());});</script></body></html>
