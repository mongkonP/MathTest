<!DOCTYPE html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>แบบทดสอบเรื่องสี่เหลี่ยมจัตุรัส</title><link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css"><link rel="stylesheet" href="../assets/css/app.css"><script src="../assets/js/quiz.js" defer></script><script src="../assets/js/navigation.js" defer></script></head><body><main class="container"><section class="app-card"><h1 class="app-title">สี่เหลี่ยมจัตุรัส</h1><p class="app-subtitle">ฝึกคำนวณพื้นที่และเส้นรอบรูป</p><div class="app-actions"><button id="newQuestions" class="btn btn-primary" type="button">สุ่มโจทย์ใหม่</button><button class="btn btn-default" type="button" data-nav-home="../index.html">← กลับหน้าเมนูหลัก</button></div><img class="img-responsive thumbnail quiz-image" src="../img/square.jpeg" alt="สี่เหลี่ยมจัตุรัส"><div id="quizQuestions"></div></section></main><script>window.addEventListener("DOMContentLoaded", () => { const quiz = new GeometryQuiz({ questions: [{ prompt: v => `สี่เหลี่ยมจัตุรัสยาวด้านละ <strong>${v.s}</strong> จะมีพื้นที่เท่าใด`, hint: "สูตร: ด้าน²", generate: () => ({ s: randomInt(10, 40) }), answer: v => v.s * v.s }, { prompt: v => `สี่เหลี่ยมจัตุรัสยาวด้านละ <strong>${v.s}</strong> จะมีเส้นรอบรูปเท่าใด`, hint: "สูตร: 4 × ด้าน", generate: () => ({ s: randomInt(10, 40) }), answer: v => 4 * v.s }] }); quiz.start(); document.getElementById("newQuestions").addEventListener("click", () => quiz.newQuestions()); });</script></body></html>
