<!DOCTYPE html>
<html lang="th">
<head>
    <title>แบบทดสอบเรื่องพีระมิดฐานสี่เหลี่ยมจัตุรัส</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>
    <style>
        body {
            background-color: #eeeadf;
        }
    </style>
</head>
<body>

<div class="container" style="margin-top: 20px;">
    <h2>แบบทดสอบเรื่องพีระมิด (ฐานสี่เหลี่ยมจัตุรัส)</h2>
    
    <button type="button" class="btn btn-primary" onclick="randomNum()">สุ่มโจทย์ใหม่</button>
    
    <hr>

    <div class="panel panel-default">
        <div class="panel-body">
            <img src="../img/piramid.jpeg" class="img-responsive thumbnail" style="max-width: 500px;" alt="พีระมิด"><br>
            <p>1. พีระมิดฐานสี่เหลี่ยมจัตุรัส มีความยาวด้านของฐาน <strong id="s1">?</strong> และความสูง <strong id="h1">?</strong> จะมีปริมาตรเท่ากับเท่าใด</p>
            <div class="form-inline">
                <div class="form-group">
                    <label>ตอบ: </label>
                    <input type="text" class="form-control" id="ans1">
                </div>
                <button type="button" class="btn btn-success" onclick="check1()">เช็คคำตอบ</button>
                <span id="result1" class="label" style="font-size: 14px;"></span>
            </div>
        </div>
    </div>

    <div class="panel panel-default">
        <div class="panel-body">
            <p>2. พีระมิดฐานสี่เหลี่ยมจัตุรัส มีพื้นที่ฐาน <strong id="baseArea2">?</strong> และพื้นที่ผิวข้าง <strong id="sideArea2">?</strong> จะมีพื้นที่ผิวทั้งหมดเท่ากับเท่าใด</p>
            <div class="form-inline">
                <div class="form-group">
                    <label>ตอบ: </label>
                    <input type="text" class="form-control" id="ans2">
                </div>
                <button type="button" class="btn btn-success" onclick="check2()">เช็คคำตอบ</button>
                <span id="result2" class="label" style="font-size: 14px;"></span>
            </div>
        </div>
    </div>
</div>

<script>
    var side1 = 0;
    var height1 = 0;
    var baseArea2 = 0;
    var sideArea2 = 0;

    function randomNum() {
        side1 = (Math.floor(Math.random() * 10) + 1) * 3;
        height1 = Math.floor(Math.random() * 151) + 100;

        baseArea2 = Math.floor(Math.random() * 151) + 100;
        sideArea2 = Math.floor(Math.random() * 151) + 100;

        document.getElementById("s1").innerText = side1;
        document.getElementById("h1").innerText = height1;

        document.getElementById("baseArea2").innerText = baseArea2;
        document.getElementById("sideArea2").innerText = sideArea2;

        document.getElementById("ans1").value = "";
        document.getElementById("ans2").value = "";
        
        var res1 = document.getElementById("result1");
        var res2 = document.getElementById("result2");
        res1.innerText = "";
        res1.className = "label";
        res2.innerText = "";
        res2.className = "label";
    }

    function check1() {
        var userAns = document.getElementById("ans1").value;
        var baseArea = side1 * side1;
        var correctAns = (1 / 3) * baseArea * height1;
        var res = document.getElementById("result1");

        if (userAns == correctAns) {
            res.innerText = "ถูกต้อง";
            res.className = "label label-success";
        } else {
            res.innerText = "ผิด";
            res.className = "label label-danger";
        }
    }

    function check2() {
        var userAns = document.getElementById("ans2").value;
        var correctAns = baseArea2 + sideArea2;
        var res = document.getElementById("result2");

        if (userAns == correctAns) {
            res.innerText = "ถูกต้อง";
            res.className = "label label-success";
        } else {
            res.innerText = "ผิด";
            res.className = "label label-danger";
        }
    }

    randomNum();
</script>

</body>
</html>
