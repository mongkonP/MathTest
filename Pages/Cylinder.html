<!DOCTYPE html>
<html lang="th">
<head>
    <title>แบบทดสอบเรื่องทรงกระบอก</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>
    <style>
        body {
            background-color: #eeeadf;
        }
    </style>
</head>
<body>

<div class="container" style="margin-top: 20px;">
    <h2>แบบทดสอบเรื่องทรงกระบอก</h2>
    <p class="text-muted">(กำหนดให้ π = 22/7)</p>
    
    <button type="button" class="btn btn-primary" onclick="randomNum()">สุ่มโจทย์ใหม่</button>
    
    <hr>

    <div class="panel panel-default">
        <div class="panel-body">
            <img src="../img/Cylinder.jpg" class="img-responsive thumbnail" style="max-width: 700px;" alt="ทรงกระบอก"><br>
            <p>1. ทรงกระบอก มี รัศมี <strong id="r1">?</strong> และ สูง <strong id="h1">?</strong> จะมีปริมาตรเท่ากับเท่าใด (ใช้ π = 22/7)</p>
            <div class="form-inline">
                <div class="form-group">
                    <label>ตอบ: </label>
                    <input type="text" class="form-control" id="ans1">
                </div>
                <button type="button" class="btn btn-success" onclick="check1()">เช็คคำตอบ</button>
                <span id="result1" class="label" style="font-size: 14px;"></span>
            </div>
        </div>
    </div>

    <div class="panel panel-default">
        <div class="panel-body">
            <p>2. ทรงกระบอก มี รัศมี <strong id="r2">?</strong> และ สูง <strong id="h2">?</strong> จะมีพื้นที่ผิวข้างเท่ากับเท่าใด (ใช้ π = 22/7)</p>
            <div class="form-inline">
                <div class="form-group">
                    <label>ตอบ: </label>
                    <input type="text" class="form-control" id="ans2">
                </div>
                <button type="button" class="btn btn-success" onclick="check2()">เช็คคำตอบ</button>
                <span id="result2" class="label" style="font-size: 14px;"></span>
            </div>
        </div>
    </div>
</div>

<script>
    var radius1 = 0;
    var height1 = 0;
    var radius2 = 0;
    var height2 = 0;

    function randomNum() {
        radius1 = (Math.floor(Math.random() * 5) + 1) * 7;
        height1 = Math.floor(Math.random() * 20) + 1;

        radius2 = (Math.floor(Math.random() * 5) + 1) * 7;
        height2 = Math.floor(Math.random() * 20) + 1;

        document.getElementById("r1").innerText = radius1;
        document.getElementById("h1").innerText = height1;

        document.getElementById("r2").innerText = radius2;
        document.getElementById("h2").innerText = height2;

        document.getElementById("ans1").value = "";
        document.getElementById("ans2").value = "";
        
        var res1 = document.getElementById("result1");
        var res2 = document.getElementById("result2");
        res1.innerText = "";
        res1.className = "label";
        res2.innerText = "";
        res2.className = "label";
    }

    function check1() {
        var userAns = document.getElementById("ans1").value;
        var correctAns = (22 / 7) * radius1 * radius1 * height1;
        var res = document.getElementById("result1");

        if (userAns == correctAns) {
            res.innerText = "ถูกต้อง";
            res.className = "label label-success";
        } else {
            res.innerText = "ผิด";
            res.className = "label label-danger";
        }
    }

    function check2() {
        var userAns = document.getElementById("ans2").value;
        var correctAns = 2 * (22 / 7) * radius2 * height2;
        var res = document.getElementById("result2");

        if (userAns == correctAns) {
            res.innerText = "ถูกต้อง";
            res.className = "label label-success";
        } else {
            res.innerText = "ผิด";
            res.className = "label label-danger";
        }
    }

    randomNum();
</script>

</body>
</html>
