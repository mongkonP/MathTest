<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>แบบทดสอบเรื่องสี่เหลี่ยมรูปว่าว</title>
    <link
      rel="stylesheet"
      href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="../assets/css/app.css" />
    <script src="../assets/js/quiz.js" defer></script>
    <script src="../assets/js/navigation.js" defer></script>
  </head>
  <body>
    <main class="container">
      <section class="app-card">
        <h1 class="app-title">สี่เหลี่ยมรูปว่าว</h1>
        <p class="app-subtitle">ฝึกคำนวณพื้นที่และเส้นรอบรูป</p>
        <div class="app-actions">
          <button id="newQuestions" class="btn btn-primary" type="button">
            สุ่มโจทย์ใหม่</button
          ><button
            class="btn btn-default"
            type="button"
            data-nav-home="../index.html"
          >
            ← กลับหน้าเมนูหลัก
          </button>
        </div>
        <img
          class="img-responsive thumbnail quiz-image"
          src="../img/kite.jpeg"
          alt="สี่เหลี่ยมรูปว่าว"
        />
        <div id="quizQuestions"></div>
      </section>
    </main>
    <script>
      window.addEventListener("DOMContentLoaded", () => {
        const quiz = new GeometryQuiz({
          questions: [
            {
              prompt: (v) =>
                `สี่เหลี่ยมรูปว่าวมีเส้นทแยงมุมยาว <strong>${v.d1}</strong> และ <strong>${v.d2}</strong> จะมีพื้นที่เท่าใด`,
              hint: "สูตร: 1/2 × ผลคูณของเส้นทแยงมุม",
              generate: () => ({
                d1: randomInt(100, 250),
                d2: randomInt(100, 250),
              }),
              answer: (v) => 0.5 * v.d1 * v.d2,
            },
            {
              prompt: (v) =>
                `สี่เหลี่ยมรูปว่าวมีด้านติดกันสองคู่ยาว <strong>${v.a}</strong> และ <strong>${v.b}</strong> จะมีเส้นรอบรูปเท่าใด`,
              hint: "สูตร: 2 × (ด้านที่ 1 + ด้านที่ 2)",
              generate: () => ({
                a: randomInt(100, 250),
                b: randomInt(100, 250),
              }),
              answer: (v) => 2 * (v.a + v.b),
            },
          ],
        });
        quiz.start();
        document
          .getElementById("newQuestions")
          .addEventListener("click", () => quiz.newQuestions());
      });
    </script>
  </body>
</html>
